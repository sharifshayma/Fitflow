name: prisma-deploy

# Prisma Compute deploy-on-push (GA Compute). Until the repository is connected
# with `npx prisma@latest git connect`, this action prints a notice, sets its
# outcome to `skipped-no-credential`, and exits green — so committing it is safe
# before the connection exists. See docs/prisma8-migration.md and
# https://www.prisma.io/docs/compute/deploy-on-push
on:
  push:

concurrency:
  group: prisma-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: prisma/cloud-deploy-action@v1
        with:
          build-command: npm run build
